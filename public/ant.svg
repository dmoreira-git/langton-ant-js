<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 340" width="520" height="680">
  <defs>
    <radialGradient id="abdomen" cx="36%" cy="26%" r="86%">
      <stop offset="0%" stop-color="#fff8d9"/>
      <stop offset="24%" stop-color="#ffd166"/>
      <stop offset="58%" stop-color="#f59e0b"/>
      <stop offset="84%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
    <radialGradient id="thorax" cx="34%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="40%" stop-color="#ffbe55"/>
      <stop offset="75%" stop-color="#ea7a1c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
    <radialGradient id="head" cx="36%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#fff6d5"/>
      <stop offset="38%" stop-color="#ffcf70"/>
      <stop offset="78%" stop-color="#e8841d"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe3a1"/>
      <stop offset="55%" stop-color="#ffb340"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="antenna" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ffe6ab"/>
    </linearGradient>
    <filter id="bodyGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ff7a1a" flood-opacity="0.7"/>
    </filter>
    <filter id="softEdge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <!-- legs, drawn behind the body -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#331604" stroke-width="16">
      <path d="M112 140 C 86 124 66 104 54 84 C 46 72 40 62 36 52"/>
      <path d="M102 160 C 76 160 54 150 38 136 C 30 129 24 122 20 114"/>
      <path d="M108 180 C 84 198 64 218 52 238 C 44 252 38 264 34 276"/>
      <path d="M148 140 C 174 124 194 104 206 84 C 214 72 220 62 224 52"/>
      <path d="M158 160 C 184 160 206 150 222 136 C 230 129 236 122 240 114"/>
      <path d="M152 180 C 176 198 196 218 208 238 C 216 252 222 264 226 276"/>
    </g>
    <g stroke="url(#leg)" stroke-width="9">
      <path d="M112 140 C 86 124 66 104 54 84 C 46 72 40 62 36 52"/>
      <path d="M102 160 C 76 160 54 150 38 136 C 30 129 24 122 20 114"/>
      <path d="M108 180 C 84 198 64 218 52 238 C 44 252 38 264 34 276"/>
      <path d="M148 140 C 174 124 194 104 206 84 C 214 72 220 62 224 52"/>
      <path d="M158 160 C 184 160 206 150 222 136 C 230 129 236 122 240 114"/>
      <path d="M152 180 C 176 198 196 218 208 238 C 216 252 222 264 226 276"/>
    </g>
    <!-- knee highlights -->
    <g stroke="#fff0c2" stroke-width="2.4" opacity="0.75">
      <path d="M98 130 C 82 116 70 103 61 90"/>
      <path d="M92 158 C 74 157 58 150 46 140"/>
      <path d="M96 191 C 80 204 67 218 58 232"/>
      <path d="M162 130 C 178 116 190 103 199 90"/>
      <path d="M168 158 C 186 157 202 150 214 140"/>
      <path d="M164 191 C 180 204 193 218 202 232"/>
    </g>
  </g>

  <!-- antennae -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#331604" stroke-width="9">
      <path d="M113 61 C 100 40 84 25 62 14"/>
      <path d="M147 61 C 160 40 176 25 198 14"/>
    </g>
    <g stroke="url(#antenna)" stroke-width="4.5">
      <path d="M113 61 C 100 40 84 25 62 14"/>
      <path d="M147 61 C 160 40 176 25 198 14"/>
    </g>
    <circle cx="61" cy="13" r="5" fill="#ffe6ab" stroke="#331604" stroke-width="2.5"/>
    <circle cx="199" cy="13" r="5" fill="#ffe6ab" stroke="#331604" stroke-width="2.5"/>
  </g>

  <!-- mandibles -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#331604" stroke-width="11">
      <path d="M114 62 C 104 48 98 38 100 30"/>
      <path d="M146 62 C 156 48 162 38 160 30"/>
    </g>
    <g stroke="#ffcf70" stroke-width="5.5">
      <path d="M114 62 C 104 48 98 38 100 30"/>
      <path d="M146 62 C 156 48 162 38 160 30"/>
    </g>
  </g>

  <!-- abdomen -->
  <g filter="url(#bodyGlow)">
    <path d="M130 180
             C 178 180 199 219 196 260
             C 193 305 164 331 130 333
             C 96 331 67 305 64 260
             C 61 219 82 180 130 180 Z"
          fill="url(#abdomen)" stroke="#3b1503" stroke-width="4"/>
    <!-- segment bands -->
    <g fill="none" stroke="#7c2d12" stroke-linecap="round" opacity="0.55">
      <path d="M72 238 C 98 252 162 252 188 238" stroke-width="3"/>
      <path d="M69 263 C 96 277 164 277 191 263" stroke-width="3"/>
      <path d="M74 288 C 99 301 161 301 186 288" stroke-width="3"/>
      <path d="M88 310 C 106 319 154 319 172 310" stroke-width="2.5"/>
    </g>
    <!-- glossy highlight -->
    <ellipse cx="105" cy="219" rx="18" ry="29" fill="#fffbe8" opacity="0.3" transform="rotate(-24 105 219)"/>
    <path d="M145 197 C 171 207 182 231 181 254" fill="none" stroke="#fff3c4" stroke-width="3" opacity="0.35" stroke-linecap="round"/>
  </g>

  <!-- waist -->
  <path d="M108 184 C 116 176 144 176 152 184 L 148 201 C 140 208 120 208 112 201 Z"
        fill="#b45309" stroke="#3b1503" stroke-width="3"/>

  <!-- thorax -->
  <g filter="url(#bodyGlow)">
    <path d="M130 114
             C 159 114 173 136 170 159
             C 167 183 152 196 130 198
             C 108 196 93 183 90 159
             C 87 136 101 114 130 114 Z"
          fill="url(#thorax)" stroke="#3b1503" stroke-width="4"/>
    <path d="M104 130 C 113 121 147 121 156 130" fill="none" stroke="#fff3c4" stroke-width="3" opacity="0.42" stroke-linecap="round"/>
    <path d="M99 168 C 112 178 148 178 161 168" fill="none" stroke="#7c2d12" stroke-width="2.5" opacity="0.55" stroke-linecap="round"/>
    <ellipse cx="114" cy="143" rx="9" ry="15" fill="#fffbe8" opacity="0.25" transform="rotate(-20 114 143)"/>
  </g>

  <!-- neck -->
  <path d="M112 108 C 120 118 140 118 148 108 L 151 126 C 140 134 120 134 109 126 Z"
        fill="#c2410c" stroke="#3b1503" stroke-width="3"/>

  <!-- head -->
  <g filter="url(#bodyGlow)">
    <path d="M130 48
             C 157 48 173 66 173 88
             C 173 111 156 125 130 125
             C 104 125 87 111 87 88
             C 87 66 103 48 130 48 Z"
          fill="url(#head)" stroke="#3b1503" stroke-width="4"/>
    <!-- eyes -->
    <ellipse cx="112" cy="83" rx="7.5" ry="10" fill="#170d06"/>
    <ellipse cx="148" cy="83" rx="7.5" ry="10" fill="#170d06"/>
    <circle cx="114" cy="80" r="2.6" fill="#8ef7e3"/>
    <circle cx="150" cy="80" r="2.6" fill="#8ef7e3"/>
    <circle cx="110" cy="87" r="1.2" fill="#fffdf0" opacity="0.8"/>
    <circle cx="146" cy="87" r="1.2" fill="#fffdf0" opacity="0.8"/>
    <!-- brow highlight -->
    <path d="M103 65 C 113 57 147 57 157 65" fill="none" stroke="#fff8d9" stroke-width="4" opacity="0.45" stroke-linecap="round"/>
    <ellipse cx="112" cy="66" rx="10" ry="5" fill="#fffdf0" opacity="0.22" transform="rotate(-12 112 66)"/>
  </g>
</svg>
